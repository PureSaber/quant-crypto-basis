name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Install locked dependencies
        run: |
          python -m pip install --no-deps --requirement requirements.lock
          python -m pip check
          python -m pip install --no-deps --no-build-isolation --editable .
          python -m pip check
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest --cov=quant_crypto_basis --cov-branch --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80

      - name: Enforce certification branch coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("coverage.json").read_text(encoding="utf-8"))
          candidates = [
              (key, value) for key, value in report["files"].items()
              if key.replace("\\", "/").endswith("/quant_crypto_basis/artifacts.py")
          ]
          if not candidates:
              raise SystemExit("certification core is missing from coverage JSON")
          summary = candidates[0][1]["summary"]
          covered = summary["covered_branches"]
          total = summary["num_branches"]
          if total == 0 or covered / total < 0.90:
              raise SystemExit(f"artifact core pure branch coverage is {covered}/{total}")
          print(f"artifact core pure branches: {covered}/{total}={covered / total:.2%}")
          PY
