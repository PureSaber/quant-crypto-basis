[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-crypto-basis"
version = "0.1.1"
description = "Offline crypto spot-perpetual basis and funding research on PureSaber frozen contracts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "tomli>=2.0; python_version < '3.11'",
    "quant-data-kit @ git+https://github.com/PureSaber/quant-data-kit.git@v0.6.1",
    "quant-execution @ git+https://github.com/PureSaber/quant-execution.git@v0.4.1",
    "quant-lab @ git+https://github.com/PureSaber/quant-lab.git@v0.3.1",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.6",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9.0",
]

[project.scripts]
qcb-run-fixture = "quant_crypto_basis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quant_crypto_basis = ["fixtures/index.json", "fixtures/*/events.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["quant_crypto_basis"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.quant-workspace]
layer = "strategy"
schemas = [
    { id = "standard/v2", version = "2.0.0" },
]
lock-files = ["requirements.lock"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
